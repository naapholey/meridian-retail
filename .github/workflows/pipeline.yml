name: Meridian-retail pipeline

run-name: Meridian-retail pipeline test run by ${{ github.actor }} on ${{ github.ref }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Infrastructure Security Scan & Provisioning
  # -------------------------------------------------------------
  infrastructure:
    name: Terraform & Security
    runs-on: ubuntu-latest

    outputs:
      ec2_public_ip: ${{ steps.get-outputs.outputs.ec2_public_ip }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

     # - name: Run Trivy vulnerability scanner in IaC mode
     #   uses: aquasecurity/trivy-action@master
      #  with:
      #    scan-type: config
      #    hide-progress: false
      #    format: sarif
      #    severity: CRITICAL
      #    exit-code: "1"
      #    output: trivy-report.sarif

      #- name: Upload Trivy Report
      #  if: always()
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: trivy-report
      #    path: trivy-report.sarif

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get GitHub Runner Public IP
        id: get-ip
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "Runner IP is $RUNNER_IP"
          echo "runner_ssh_ip=\"${RUNNER_IP}/32\"" > terraform/terraform.tfvars

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform Outputs
        id: get-outputs
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$EC2_IP" >> "$GITHUB_OUTPUT"